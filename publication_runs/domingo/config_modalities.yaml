# Domingo dataset -- additional (non-primary) modalities, fit per cis gene
# after that gene's fit_cis has run. Consumed by generate_slurm.py and
# load_modalities.py.
#
# `name` becomes both the modality name passed to load_modalities.load() and
# the bayesDREAM modality_name used for fit_trans. "Donor efficiency" /
# "Acceptor efficiency" were requested as both binomial and multinomial --
# since a model's modality names must be unique, these are split into
# `donor_efficiency`/`acceptor_efficiency` (binomial) and `donor_usage`/
# `acceptor_usage` (multinomial); rename freely, load_modalities.py just
# needs to recognize whatever names are listed here.
#
# function_type: additive_hill everywhere except multinomial, where the
# per-category dose-response is fit as single_hill (per user instruction).

modalities:
  - name: sj
    distribution: binomial
    function_type: additive_hill
  - name: ir
    distribution: binomial
    function_type: additive_hill
  - name: es
    distribution: binomial
    function_type: additive_hill
  - name: mxe
    distribution: binomial
    function_type: additive_hill
  - name: velocity
    distribution: binomial
    function_type: additive_hill
  - name: donor_efficiency
    distribution: binomial
    function_type: additive_hill
  - name: acceptor_efficiency
    distribution: binomial
    function_type: additive_hill
  - name: donor_usage
    distribution: multinomial
    function_type: single_hill
  - name: acceptor_usage
    distribution: multinomial
    function_type: single_hill
