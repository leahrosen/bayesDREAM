# Domingo dataset -- additional (non-primary) modalities, fit per cis gene
# after that gene's fit_cis has run. Consumed by generate_slurm.py and
# load_modalities.py.
#
# `stype` is the subdirectory name under the shared loader_inputs/ directory
# (config.yaml's modalities.data_dir -- the SAME directory for every gene;
# per-gene cell subsetting happens inside the loader by aligning against
# that gene's model.meta['L_cell_barcode'], not via a per-gene directory).
# `name` = f'{name_prefix}_{stype}' is the resulting bayesDREAM modality
# name, used for fit_trans.
#
# Confirmed from real loader code (6 worked examples): sj, exon_skip,
# intron_retention, gene_velocity, mxe (binomial) and donor_choice
# (multinomial). `acceptor_choice` is added below as the natural multinomial
# counterpart to donor_choice (same splicing-site-choice pattern, opposite
# end of the intron) but has NOT been confirmed against a real
# loader_inputs/acceptor_choice/ directory -- verify it exists (or remove
# this entry) before running. `donor_efficiency`/`acceptor_efficiency` are
# binomial, analogous to exon_skip/intron_retention/mxe/gene_velocity (own
# denominator.npz file, gene_name aliasing) per explicit confirmation --
# their loader_inputs/ directories are assumed to exist and follow the same
# layout; not independently verified against real files the way the other
# six were.
#
# gene_alias_col: feature_meta column aliased to 'gene' inside the loader
# (varies by modality -- 'gene_for_denominator' for sj, 'gene_name' for the
# rest; donor_choice/acceptor_choice don't use gene aliasing at all).
#
# denominator_mode:
#   file            -- separate denominator.npz in the same stype directory
#                       (exon_skip, intron_retention, gene_velocity, mxe)
#   gene_expression -- denominator = primary (+cis) modality's gene counts,
#                       features filtered to genes present in the model,
#                       counts>denominator violations optionally clipped
#                       (sj only)
#   null            -- multinomial modalities (no denominator)
#
# function_type: additive_hill everywhere except multinomial, where the
# per-category dose-response is fit as single_hill (per user instruction).
#
# min_denominator: required by fit_trans() for binomial/multinomial
# (bayesDREAM/fitting/trans.py) -- 0 means no additional filtering beyond
# what add_custom_modality() already applies.

modalities:
  # `cores:` (2026-08-11, from real profiling) sizes this modality's OWN
  # fit job (and its permutation/recapitulation jobs, for binomial entries
  # -- see domingo/config.yaml's modalities.trans comment) -- overrides
  # modalities.resources.cores in config.yaml for this stype only. Absent
  # on donor_choice/acceptor_choice (multinomial, GPU-packed) on purpose --
  # those fall back to modalities.resources.cores for thread-pinning.
  - stype: sj
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_for_denominator
    denominator_mode: gene_expression
    clip_violations: true
    save_diagnostic_plot: true
    min_denominator: 0
    cores: 4
  - stype: exon_skip
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_name
    denominator_mode: file
    min_denominator: 0
    cores: 2
  - stype: intron_retention
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_name
    denominator_mode: file
    min_denominator: 0
    cores: 2
  - stype: mxe
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_name
    denominator_mode: file
    min_denominator: 0
    cores: 2
  - stype: gene_velocity
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_name
    denominator_mode: file
    min_denominator: 0
    cores: 2
  - stype: donor_efficiency
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_name
    denominator_mode: file
    min_denominator: 0
    cores: 4
  - stype: acceptor_efficiency
    distribution: binomial
    function_type: additive_hill
    gene_alias_col: gene_name
    denominator_mode: file
    min_denominator: 0
    cores: 4
  - stype: donor_choice
    distribution: multinomial
    function_type: single_hill
    min_denominator: 0
  - stype: acceptor_choice   # TODO: confirm loader_inputs/acceptor_choice/ actually exists
    distribution: multinomial
    function_type: single_hill
    min_denominator: 0
